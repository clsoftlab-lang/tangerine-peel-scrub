#
# Cloudflare Workers 배포 설정 (무료 티어 · 무인 운영)
#   wrangler secret put ANTHROPIC_API_KEY   # 키는 시크릿에만 (레포/브라우저 금지)
#   wrangler deploy
# 배포 후 프런트 ai/config.js 의 AI_ENDPOINT 를 https://<worker>.workers.dev/api/ai 로.

name = "gyulgyeol-ai-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

# 비용 우선 기본 모델. 품질을 높이려면 claude-sonnet-5 / claude-opus-5 로 변경.
[vars]
AI_MODEL = "claude-haiku-4-5"
AI_MONTHLY_TOKEN_CAP = "2000000"
# AI_EFFORT = "low"   # haiku 가 아닌 모델에서만 사용됨

# ⚠️ ANTHROPIC_API_KEY 는 vars 가 아니라 시크릿으로 설정한다:
#   wrangler secret put ANTHROPIC_API_KEY
